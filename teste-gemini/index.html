<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cérebro Holográfico 3D</title>
  <style>
    body {
      margin: 0;
      background-color: #141210; /* Seu fundo Preto Amarronzado */
      height: 300vh; /* Altura simulada para testar o scroll */
      overflow-x: hidden;
    }

    .instructions {
      position: fixed;
      z-index: 11;
      left: 24px;
      top: 20px;
      color: #eee4d8;
      font: 14px/1.5 system-ui, sans-serif;
      pointer-events: none;
      max-width: 300px;
    }
    .instructions small { color: #c6a588; }

    /* Container fixo para o cérebro acompanhar a tela */
    #brain-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none; /* Permite clicar no conteúdo do site atrás do canvas */
      z-index: 10;
    }
  </style>

  <!-- Import do Three.js via CDN -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <div class="instructions"><strong>Teste do cérebro do Gemini</strong><br><small>Mova o mouse e role a página para girar.</small></div>
  <div id="brain-container"></div>

  <script>
    // ----------------------------------------------------
    // 1. CONFIGURAÇÃO INICIAL DA CENA E RENDERIZADOR
    // ----------------------------------------------------
    const container = document.getElementById('brain-container');
    const scene = new THREE.Scene();

    const camera = new THREE.PerspectiveCamera(
      60, 
      window.innerWidth / window.innerHeight, 
      0.1, 
      1000
    );
    camera.position.z = 4.5;

    const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    container.appendChild(renderer.domElement);

    // ----------------------------------------------------
    // 2. CRIAÇÃO DA GEOMETRIA DO CÉREBRO (POINT CLOUD)
    // ----------------------------------------------------
    const brainGroup = new THREE.Group();
    scene.add(brainGroup);

    const particleCount = 4500;
    const geometry = new THREE.BufferGeometry();
    const positions = new Float32Array(particleCount * 3);
    const colors = new Float32Array(particleCount * 3);

    // Cores da sua paleta em RGB normalizado (0 a 1)
    const colorChampagne = new THREE.Color('#C6A588'); // Detalhes / Champanhe
    const colorIvory = new THREE.Color('#EEE4D8');     // Marfim suave

    for (let i = 0; i < particleCount; i++) {
      // Equações paramétricas aproximadas para os dois hemisférios cerebrais
      const u = Math.random() * Math.PI * 2;
      const v = (Math.random() - 0.5) * Math.PI;

      const side = Math.random() < 0.5 ? -1 : 1;
      
      // Formato elipsoide com reentrâncias para simular os lobos cerebrais
      let x = (1.2 + 0.2 * Math.cos(3 * v)) * Math.cos(v) * Math.sin(u) * 0.9 + (side * 0.28);
      let y = (1.0 + 0.15 * Math.sin(4 * u)) * Math.sin(v) * 1.1;
      let z = (1.5 + 0.2 * Math.cos(2 * u)) * Math.cos(v) * Math.cos(u) * 0.95;

      // Adiciona pequenas ondulações (sulcos cerebrais)
      x += Math.sin(y * 8) * 0.05;
      y += Math.cos(z * 8) * 0.05;
      z += Math.sin(x * 8) * 0.05;

      positions[i * 3]     = x;
      positions[i * 3 + 1] = y;
      positions[i * 3 + 2] = z;

      // Interpolação aleatória entre as cores da paleta
      const mixedColor = colorChampagne.clone().lerp(colorIvory, Math.random());
      colors[i * 3]     = mixedColor.r;
      colors[i * 3 + 1] = mixedColor.g;
      colors[i * 3 + 2] = mixedColor.b;
    }

    geometry.setAttribute('position', new THREE.BufferAttribute(positions, 3));
    geometry.setAttribute('color', new THREE.BufferAttribute(colors, 3));

    // Textura circular suave para os pontos (estilo luz holográfica)
    const canvas = document.createElement('canvas');
    canvas.width = 16;
    canvas.height = 16;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(8, 8, 0, 8, 8, 8);
    grad.addColorStop(0, 'rgba(255,255,255,1)');
    grad.addColorStop(1, 'rgba(255,255,255,0)');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, 16, 16);
    const texture = new THREE.CanvasTexture(canvas);

    const material = new THREE.PointsMaterial({
      size: 0.045,
      vertexColors: true,
      map: texture,
      transparent: true,
      opacity: 0.85,
      blending: THREE.AdditiveBlending,
      depthWrite: false
    });

    const brainParticles = new THREE.Points(geometry, material);
    brainGroup.add(brainParticles);

    // ----------------------------------------------------
    // 3. LÓGICA DO MOUSE E SCROLL
    // ----------------------------------------------------
    
    // Posição atual do mouse (normalizada entre -1 e +1)
    const mouse = { x: 0, y: 0 };
    // Posição que o objeto busca alcançar (para o efeito de suavização/interpolação)
    const targetRotation = { x: 0, y: 0 };

    // Captura o movimento do mouse
    window.addEventListener('mousemove', (e) => {
      // Converte coordenadas da tela de px para a escala [-1, 1]
      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
    });

    // Rotação de 180° (Math.PI em radianos) baseada no Scroll da página
    let scrollRotationY = 0;
    window.addEventListener('scroll', () => {
      const maxScroll = document.documentElement.scrollHeight - window.innerHeight;
      const scrollFraction = window.scrollY / (maxScroll || 1);
      
      // 180 graus = Math.PI radianos
      scrollRotationY = scrollFraction * Math.PI; 
    });

    // Ajuste em caso de redimensionamento de janela
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    // ----------------------------------------------------
    // 4. LOOP DE ANIMAÇÃO (RENDER)
    // ----------------------------------------------------
    function animate() {
      requestAnimationFrame(animate);

      // A) Define a meta de rotação combinando Mouse + Scroll
      // O mouse afeta os eixos X e Y suavemente
      const targetMouseX = mouse.y * 0.3; // Rotação no eixo X baseada na vertical do mouse
      const targetMouseY = mouse.x * 0.4 + scrollRotationY; // Rotação Y (Mouse + Scroll 180°)

      // B) LERP (Linear Interpolation) / Suavização:
      // Em vez de mudar instantaneamente, o objeto anda 5% (0.05) do caminho a cada frame.
      brainGroup.rotation.x += (targetMouseX - brainGroup.rotation.x) * 0.05;
      brainGroup.rotation.y += (targetMouseY - brainGroup.rotation.y) * 0.05;

      // Pequena oscilação contínua (pulso de flutuação)
      brainGroup.position.y = Math.sin(Date.now() * 0.0015) * 0.05;

      renderer.render(scene, camera);
    }

    animate();
  </script>
</body>
</html>
